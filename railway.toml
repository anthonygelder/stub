[service]
name = "stub"

[build]
builder = "nixpacks"
watchPatterns = ["client/src/**", "server/src/**", "package.json"]

[build.variables]
NIXPACKS_INSTALL_CMD = "npm install --legacy-peer-deps"

[deploy]
# NODE_ENV is set on the node process only (not the build) so the server serves
# the client build and uses production config, without npm skipping devDeps at build.
startCommand = "cd server && npx prisma generate && npx prisma migrate deploy && NODE_ENV=production node dist/index.js"
healthcheckPath = "/health"

[deploy.variables]
PORT = "3000"
NODE_ENV = "production"
