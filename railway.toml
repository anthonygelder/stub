[service]
name = "stub"

[build]
builder = "nixpacks"
watchPatterns = ["client/src/**", "server/src/**", "package.json"]

[build.variables]
NIXPACKS_INSTALL_CMD = "npm install --legacy-peer-deps"

[deploy]
startCommand = "cd server && npx prisma generate && npx prisma migrate deploy && node dist/index.js"
healthcheckPath = "/health"

[deploy.variables]
PORT = "3000"
NODE_ENV = "production"
